<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<title>{{subject}}</title>
</head>
<body style="margin:0;padding:0;background:#f4f1fb;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f1fb;padding:24px 0;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;">

        <!-- Header -->
        <tr><td style="padding:0 24px 0 24px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:linear-gradient(135deg,#7C5CFC 0%,#F72585 55%,#FF6B35 100%);background-color:#7C5CFC;border-radius:16px 16px 0 0;">
            <tr><td align="center" style="padding:32px 24px;">
              <p style="margin:0;font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;font-size:26px;font-weight:800;color:#ffffff;letter-spacing:-0.5px;">Eclatale</p>
            </td></tr>
          </table>
        </td></tr>

        <!-- Body -->
        <tr><td style="padding:0 24px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#ffffff;">
            <tr><td style="padding:32px 24px;font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;color:#1A1A2E;">
              {{BODY}}
            </td></tr>
          </table>
        </td></tr>

        <!-- Footer -->
        <tr><td style="padding:0 24px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f8f7fc;border-radius:0 0 16px 16px;">
            <tr><td align="center" style="padding:20px 24px;">
              <p style="margin:0;font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;font-size:12px;line-height:1.6;color:#9a92ad;">
                &copy; 2026 Eclatale &middot; <a href="mailto:support@eclatale.com" style="color:#9a92ad;">support@eclatale.com</a>{{UNSUB_LINE}}
              </p>
              <p style="margin:8px 0 0;font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;font-size:11px;line-height:1.5;color:#b8b2c9;">
                You received this because you signed up for Eclatale.
              </p>
            </td></tr>
          </table>
        </td></tr>

      </table>
    </td></tr>
  </table>
</body>
</html>
