<h1 style="margin:0 0 16px 0;font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;font-size:26px;font-weight:800;color:#1A1A2E;">Password reset request</h1>
<p style="margin:0 0 24px 0;font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;font-size:15px;line-height:1.6;color:#4a4560;">
  Hi {{firstName}}, we received a request to reset the password for your Eclatale account. Click below to choose a new password.
</p>
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 auto 20px auto;">
  <tr><td align="center" style="border-radius:12px;background:linear-gradient(135deg,#7C5CFC,#F72585);background-color:#7C5CFC;">
    <a href="{{ctaUrl}}" style="display:inline-block;font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;color:#ffffff;text-decoration:none;padding:14px 32px;">Reset My Password &rarr;</a>
  </td></tr>
</table>
<p style="margin:0;text-align:center;font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5;color:#9a92ad;">
  This link expires in 1 hour. If you didn't request this, your account is safe &mdash; just ignore this email.
</p>
