<h1 style="margin:0 0 16px 0;font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;font-size:26px;font-weight:800;color:#1A1A2E;">We miss you, {{firstName}}</h1>
<p style="margin:0 0 20px 0;font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;font-size:15px;line-height:1.6;color:#4a4560;">
  You haven't posted in 7 days. Your streak is at risk &mdash; and your competitors aren't taking days off.
</p>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f8f7fc;border-radius:12px;margin:0 0 24px 0;">
  <tr><td style="padding:16px 20px;">
    <p style="margin:0 0 6px 0;font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;font-size:13px;color:#1A1A2E;">Last post: <strong>{{lastPostDate}}</strong></p>
    <p style="margin:0 0 6px 0;font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;font-size:13px;color:#1A1A2E;">Current streak: <strong>{{streak}} days</strong></p>
    <p style="margin:0;font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;font-size:13px;color:#1A1A2E;">Growth score: <strong>{{growthScore}}/100</strong></p>
  </td></tr>
</table>

<table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 auto;">
  <tr><td align="center" style="border-radius:12px;background:linear-gradient(135deg,#7C5CFC,#F72585);background-color:#7C5CFC;">
    <a href="{{ctaUrl}}" style="display:inline-block;font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;color:#ffffff;text-decoration:none;padding:14px 32px;">Generate a Post Now &rarr;</a>
  </td></tr>
</table>
