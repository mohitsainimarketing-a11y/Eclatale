<h1 style="margin:0 0 20px 0;font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;font-size:26px;font-weight:800;color:#1A1A2E;">Your weekly brand summary</h1>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 24px 0;">
  <tr>
    <td width="33%" style="padding:0 4px 0 0;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f8f7fc;border-radius:12px;">
        <tr><td align="center" style="padding:16px 6px;">
          <p style="margin:0;font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;font-size:22px;font-weight:800;color:#7C5CFC;">{{postsCount}}</p>
          <p style="margin:4px 0 0 0;font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;font-size:11px;color:#8a7fa8;">posts created</p>
        </td></tr>
      </table>
    </td>
    <td width="33%" style="padding:0 4px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f8f7fc;border-radius:12px;">
        <tr><td align="center" style="padding:16px 6px;">
          <p style="margin:0;font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;font-size:22px;font-weight:800;color:#7C5CFC;">{{streak}}d &#128293;</p>
          <p style="margin:4px 0 0 0;font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;font-size:11px;color:#8a7fa8;">current streak</p>
        </td></tr>
      </table>
    </td>
    <td width="33%" style="padding:0 0 0 4px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f8f7fc;border-radius:12px;">
        <tr><td align="center" style="padding:16px 6px;">
          <p style="margin:0;font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;font-size:22px;font-weight:800;color:#7C5CFC;">{{growthScore}}/100</p>
          <p style="margin:4px 0 0 0;font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;font-size:11px;color:#8a7fa8;">growth score</p>
        </td></tr>
      </table>
    </td>
  </tr>
</table>

<p style="margin:0 0 12px 0;font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;font-size:12px;color:#8a7fa8;font-weight:700;letter-spacing:1px;text-transform:uppercase;">3 post ideas for this week</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 20px 0;">
  {{topicsHtml}}
</table>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f0ebff;border-radius:12px;margin:0 0 24px 0;">
  <tr><td style="padding:16px 18px;">
    <p style="margin:0 0 6px 0;font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;font-size:12px;color:#7C5CFC;font-weight:700;letter-spacing:0.5px;">TIP OF THE WEEK</p>
    <p style="margin:0;font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;font-size:14px;line-height:1.55;color:#1A1A2E;">{{tipOfWeek}}</p>
  </td></tr>
</table>

<table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 auto;">
  <tr><td align="center" style="border-radius:12px;background:linear-gradient(135deg,#7C5CFC,#F72585);background-color:#7C5CFC;">
    <a href="{{ctaUrl}}" style="display:inline-block;font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;color:#ffffff;text-decoration:none;padding:14px 32px;">Create This Week's Posts &rarr;</a>
  </td></tr>
</table>
