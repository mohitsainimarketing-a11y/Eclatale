<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #1A1A2E;
    background: #fff;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px; border-bottom: 1px solid rgba(124,92,252,0.08);
  }
  header h1 { font-size: 14px; font-weight: 800; }
  header button {
    border: none; background: transparent; cursor: pointer; color: #6B7280;
    font-size: 18px; line-height: 1; padding: 4px;
  }
  main { flex: 1; overflow-y: auto; padding: 16px; }
  p.lead { font-size: 13px; color: #1A1A2E; font-weight: 600; margin-bottom: 12px; }
  p.muted { font-size: 12px; color: #6B7280; line-height: 1.5; margin-bottom: 12px; }
  .card {
    border: 1px solid rgba(124,92,252,0.1); border-radius: 12px; padding: 12px;
    margin-bottom: 10px;
  }
  .card p { font-size: 12px; color: #1A1A2E; line-height: 1.4; margin-bottom: 8px; }
  a.action, button.action {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; font-weight: 700; color: #7C5CFC; text-decoration: none;
    border: none; background: none; cursor: pointer; padding: 0;
  }
  .btn-primary {
    display: block; text-align: center; text-decoration: none;
    background: linear-gradient(135deg, #7C5CFC 0%, #F72585 100%);
    color: #fff; font-weight: 700; font-size: 13px;
    border-radius: 999px; padding: 10px 16px; margin-top: 8px;
  }
  .signin { text-align: center; padding: 40px 16px; }
  .signin p { font-size: 13px; color: #6B7280; margin-bottom: 16px; }
  .loading { text-align: center; padding: 40px 16px; color: #9CA3AF; font-size: 12px; }
  .stats { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid rgba(124,92,252,0.08); }
  .stats div { flex: 1; text-align: center; }
  .stats .num { font-size: 15px; font-weight: 800; color: #1A1A2E; }
  .stats .label { font-size: 10px; color: #6B7280; }
</style>
</head>
<body>
  <header>
    <h1>Aria · Brand Assistant</h1>
    <button id="closeBtn" aria-label="Close">&times;</button>
  </header>
  <main id="content"><div class="loading">Loading…</div></main>
  <div id="statsBar"></div>
  <script src="../utils/auth.js"></script>
  <script src="../utils/api.js"></script>
  <script src="sidebar.js"></script>
</body>
</html>
